name: Daily Flood Prediction

on:
  schedule:
    - cron: '25 18 * * *'
  workflow_dispatch:
  
permissions:
  contents: write
   
jobs:
  predict-flood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # ✅ Changed to 3.10
        
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🚀 Run Flood Prediction
      env:
        THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
        THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
        THINGSBOARD_DEVICE_ID: ${{ secrets.THINGSBOARD_DEVICE_ID }}
        THINGSBOARD_TOKEN: ${{ secrets.THINGSBOARD_TOKEN }}
        SHEET_URL: ${{ secrets.SHEET_URL }}
      run: python main_github.py
      
    - name: 💾 Save updated CSV to GitHub
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add daily_flood_data.csv
        if ! git diff --cached --quiet; then
         git commit -m "Update flood monitoring data"
         git fetch origin main 
         git rebase origin/main
         git push origin HEAD:main
        else
          echo "No changes to commit"
        fi
      
    - name: 💾 Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: prediction-results
        path: daily_flood_data.csv
        retention-days: 60

    # re-enable schedule

